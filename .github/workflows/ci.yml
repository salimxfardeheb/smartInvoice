name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Une nouvelle poussée annule les exécutions en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations PostgreSQL, pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartinvoice
          POSTGRES_PASSWORD: smartinvoice
          POSTGRES_DB: smartinvoice
        ports:
          - 5432:5432
        # Le job ne démarre qu'une fois la base réellement prête à répondre.
        options: >-
          --health-cmd "pg_isready -U smartinvoice -d smartinvoice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://smartinvoice:smartinvoice@localhost:5432/smartinvoice
      JWT_SECRET_KEY: ci-only-secret-0123456789abcdef
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances système (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            tesseract-ocr tesseract-ocr-fra libgl1 libglib2.0-0

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Linter (ruff)
        run: ruff check app tests

      - name: Appliquer les migrations sur PostgreSQL
        # C'est ici que la compatibilité PostgreSQL est réellement exercée :
        # la suite pytest, elle, tourne sur SQLite en mémoire (tests/conftest.py).
        # Ce pas valide le DDL spécifique — JSONB, contraintes CHECK, enums non
        # natifs — qu'un run SQLite ne peut pas couvrir.
        run: alembic upgrade head

      - name: Vérifier la réversibilité des migrations
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests (pytest)
        run: python -m pytest -q

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Linter (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Tests (Jest)
        run: npm test

      - name: Build de production
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  docker:
    name: Build des images Docker
    runs-on: ubuntu-latest
    # Les images ne sont construites que si le code passe déjà les contrôles.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # L'image backend précharge les modèles PaddleOCR : le build télécharge
      # plusieurs centaines de Mo et dure nettement plus longtemps.
      - name: Construire l'image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
