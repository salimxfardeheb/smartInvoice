<title>Feuille de route SmartInvoice Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style id="si-style">
:root{
  --ground:#f1f5f9;--surface:#ffffff;--raised:#f8fafc;
  --ink:#0f172a;--ink-2:#475569;--ink-3:#5b6a80;
  --line:#e2e8f0;--line-strong:#cbd5e1;
  --accent:#2563eb;--accent-ink:#1d4ed8;--wash:#e8effd;
  --bar:#2563eb;--bar-wash:#7ea6f2;--track:#e2e8f0;
  --crit:#d03b3b;--serious:#ec835a;--neutral:#94a3b8;--good:#0ca30c;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px -16px rgba(15,23,42,.18);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0b1220;--surface:#111a2e;--raised:#16213a;
  --ink:#e6ebf5;--ink-2:#a3aec2;--ink-3:#8190a8;
  --line:#1f2b44;--line-strong:#2c3a57;
  --accent:#7aa5f7;--accent-ink:#a9c4fa;--wash:#1a2a4d;
  --bar:#6d9cf5;--bar-wash:#2f5296;--track:#1f2b44;
  --neutral:#64748b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0b1220;--surface:#111a2e;--raised:#16213a;
  --ink:#e6ebf5;--ink-2:#a3aec2;--ink-3:#8190a8;
  --line:#1f2b44;--line-strong:#2c3a57;
  --accent:#7aa5f7;--accent-ink:#a9c4fa;--wash:#1a2a4d;
  --bar:#6d9cf5;--bar-wash:#2f5296;--track:#1f2b44;
  --neutral:#64748b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15.5px/1.6 var(--sans);padding-inline:16px;padding-block:0 96px}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--cond);text-wrap:balance;margin:0;letter-spacing:-.005em}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:.9em}
.label{font:600 12.5px/1.3 var(--cond);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

.shell{max-width:1120px;margin-inline:auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:48px;padding-block:40px 0}
.rail{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:20px}
.content{display:flex;flex-direction:column;gap:56px;min-width:0;max-width:780px}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr);gap:32px;padding-block:24px 0}
  .rail{position:static}
  .content{max-width:none}
}

/* En-tête */
.masthead{display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink-2);font:600 14px/1 var(--cond);letter-spacing:.02em}

.masthead h1{font-size:clamp(30px,5.2vw,42px);line-height:1.08;font-weight:600}
.lede{color:var(--ink-2);max-width:62ch;font-size:16.5px}
.fiche{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.fiche>div{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fiche>div+div{border-left:1px solid var(--line)}
.fiche .value{font:600 28px/1.1 var(--sans);letter-spacing:-.01em}
.fiche .value small{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:4px}
.fiche .hint{font-size:13px;color:var(--ink-3);line-height:1.45}
@media (max-width:620px){.fiche{grid-template-columns:minmax(0,1fr)}.fiche>div+div{border-left:0;border-top:1px solid var(--line)}}
.assume{font-size:13.5px;color:var(--ink-3);line-height:1.55}
.assume strong{color:var(--ink-2);font-weight:600}
/* Rail */
.rail-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.progress-total{font:600 22px/1.1 var(--sans)}
.progress-total small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:4px}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:3px}
.rail-note{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.toc a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:14px;line-height:1.35}
.toc a:hover{background:var(--wash);color:var(--ink)}
.toc-num{font:500 12.5px/1 var(--mono);color:var(--ink-3)}
.toc-count{font:500 12px/1 var(--mono);color:var(--ink-3)}
.toc-sep{height:1px;background:var(--line);margin:6px 8px}
@media (max-width:960px){.rail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.rail{grid-template-columns:minmax(0,1fr)}.toc{grid-template-columns:minmax(0,1fr)}}

/* Blocs */
.block{display:flex;flex-direction:column;gap:18px;scroll-margin-top:24px}
.block-head{display:flex;flex-direction:column;gap:8px}
.block-head h2{font-size:26px;line-height:1.15;font-weight:600}
.intro{color:var(--ink-2);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}

/* Graphique */
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--ink-2)}
.key{display:inline-flex;align-items:center;gap:8px}
.swatch{width:14px;height:10px;border-radius:2px;background:var(--bar)}
.swatch.wash{background:var(--bar-wash)}
.rows{display:flex;flex-direction:column;margin-top:14px}
.row{display:grid;grid-template-columns:10.5rem minmax(0,1fr) 5.5rem;gap:14px;align-items:center;padding-block:6px;border-radius:6px;cursor:default}
.row:hover .bar-solid,.row:focus-visible .bar-solid{filter:brightness(1.12)}
.row-label{font-size:13.5px;color:var(--ink);line-height:1.3;min-width:0}
.row-label .mono{color:var(--ink-3);margin-right:6px}
.row-track{position:relative;height:22px}
.row-value{font:500 13px/1 var(--mono);color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid-line{position:absolute;top:-6px;bottom:-6px;width:1px;background:var(--line)}
.grid-line.base{background:var(--line-strong)}
.bar-solid,.bar-wash{position:absolute;top:4px;height:14px}
.bar-solid{background:var(--bar)}
.bar-wash{background:var(--bar-wash);border-radius:0 4px 4px 0}
.axis{display:grid;grid-template-columns:10.5rem minmax(0,1fr) 5.5rem;gap:14px;margin-top:6px}
.axis-track{position:relative;height:16px}
.tick{position:absolute;transform:translateX(-50%);font:400 11.5px/1 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.axis-unit{font-size:12px;color:var(--ink-3);text-align:right}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
// Les segments entre accents graves deviennent du code ; jamais d'innerHTML.
function rich(parent, str) {
  str.split("`").forEach((part, i) => {
    if (part) parent.append(i % 2 ? el("code", null, part) : document.createTextNode(part));
  });
  return parent;
}
function span(lo, hi, unit) {
  return (lo === hi ? fmt(lo) : fmt(lo) + "–" + fmt(hi)) + (unit ? " " + unit : "");
}
function totals(items) {
  return items.reduce((a, t) => ({ lo: a.lo + t.lo, hi: a.hi + t.hi }), { lo: 0, hi: 0 });
}
function dots(n, max = 5) {
  const d = el("span", "dots");
  d.setAttribute("role", "img");
  d.setAttribute("aria-label", "Complexité " + n + " sur " + max);
  for (let i = 1; i <= max; i++) d.append(el("i", i <= n ? "on" : null));
  return d;
}

const PHASES = ROADMAP.phases.map(p => Object.assign({}, p, totals(p.tasks)));
{
  // Fenêtre de semaines : début au plus tôt (scénario bas), fin au plus tard (scénario haut).
  let cumLo = 0, cumHi = 0;
  for (const p of PHASES) {
    p.wStart = Math.floor(cumLo / DAYS_PER_WEEK) + 1;
    cumLo += p.lo;
    cumHi += p.hi;
    p.wEnd = Math.max(p.wStart, Math.ceil(cumHi / DAYS_PER_WEEK));
  }
}
const TOTAL = totals(PHASES);
const ALL_TASKS = PHASES.flatMap(p => p.tasks);
const weeks = p => (p.wStart === p.wEnd ? "semaine " + p.wStart : "semaines " + p.wStart + " à " + p.wEnd);

function block(id, kicker, title, intro) {
  const s = el("section", "block");
  s.id = id;
  const h = el("div", "block-head");
  const h2 = el("h2", null, title);
  h2.id = id + "-titre";
  s.setAttribute("aria-labelledby", h2.id);
  h.append(el("div", "label", kicker), h2);
  if (intro) h.append(el("p", "intro", intro));
  s.append(h);
  return s;
}

function figure(label, value, unit, hint, extra) {
  const d = el("div");
  const v = el("div", "value", value);
  v.append(el("small", null, unit));
  if (extra) { v.append(" "); v.append(extra); }
  d.append(el("div", "label", label), v, el("p", "hint", hint));
  return d;
}

function renderChart() {
  const sec = block("effort", "Planning", "Effort par phase",
    "Partie pleine : estimation basse. Partie claire : marge jusqu'à l'estimation haute. Les phases s'enchaînent dans l'ordre ; la construction du paquet Windows (phase 4) et la recette (phase 6) concentrent l'incertitude.");
  const card = el("div", "card");
  const legend = el("div", "legend");
  const k1 = el("span", "key"), k2 = el("span", "key");
  k1.append(el("span", "swatch"), "Estimation basse");
  k2.append(el("span", "swatch wash"), "Marge jusqu'à l'estimation haute");
  legend.append(k1, k2);

  const max = Math.ceil(Math.max(...PHASES.map(p => p.hi)) / 5) * 5;
  const ticks = [];
  for (let v = 0; v <= max; v += 5) ticks.push(v);
  const pct = v => (v / max * 100) + "%";

  const rows = el("div", "rows");
  rows.setAttribute("role", "list");
  for (const p of PHASES) {
    const row = el("div", "row");
    row.setAttribute("role", "listitem");
    row.tabIndex = 0;
    row.setAttribute("aria-label", "Phase " + p.n + ", " + p.short + " : " + span(p.lo, p.hi, "jours-homme") + ", " + weeks(p) + ", complexité " + p.complexity + " sur 5");
    const label = el("div", "row-label");
    label.append(el("span", "mono", String(p.n)), p.short);
    const track = el("div", "row-track");
    track.setAttribute("aria-hidden", "true");
    for (const v of ticks) {
      const g = el("span", "grid-line" + (v === 0 ? " base" : ""));
      g.style.left = pct(v);
      track.append(g);
    }
    const solid = el("span", "bar-solid");
    solid.style.left = "0";
    if (p.hi > p.lo) {
      // 2 px de fond entre la partie pleine et la marge.
      solid.style.width = "calc(" + pct(p.lo) + " - 1px)";
      const wash = el("span", "bar-wash");
      wash.style.left = "calc(" + pct(p.lo) + " + 1px)";
      wash.style.width = "calc(" + pct(p.hi - p.lo) + " - 1px)";
      track.append(solid, wash);
    } else {
      solid.style.width = pct(p.lo);
      solid.style.borderRadius = "0 4px 4px 0";
      track.append(solid);
    }
    row.append(label, track, el("div", "row-value", span(p.lo, p.hi, "j")));
    bindTip(row, [span(p.lo, p.hi, "j/h"), "Phase " + p.n + " · " + p.title, weeks(p).replace(/^s/, "S") + " · complexité " + p.complexity + "/5"]);
    rows.append(row);
  }
  const axis = el("div", "axis");
  axis.setAttribute("aria-hidden", "true");
  const at = el("div", "axis-track");
  for (const v of ticks) {
    const t = el("span", "tick", String(v));
    t.style.left = pct(v);
    at.append(t);
  }
  axis.append(el("span"), at, el("span", "axis-unit", "j/h"));
  card.append(legend, rows, axis);
  sec.append(card);
  return sec;
}

function cell(tag, cls, content) {
  const c = el(tag, cls);
  if (content instanceof Node) c.append(content); else if (content != null) c.textContent = content;
  return c;
}

function table(headers, minWidth) {
  const t = el("table");

  const thead = el("thead");
  thead.append(tr);
  t.append(thead, el("tbody"));
  return t;
}

/* ---- Info-bulles ---- */
let tipEl = null;
function showTip(lines, x, y) {
  if (!tipEl) {
    tipEl = el("div", "tip");
    tipEl.setAttribute("role", "tooltip");
    document.body.append(tipEl);
  }
  tipEl.textContent = "";
  tipEl.append(el("strong", null, lines[0]));
  for (const l of lines.slice(1)) tipEl.append(el("span", null, l));
  tipEl.hidden = false;
  const r = tipEl.getBoundingClientRect();
  const pad = 12;
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - pad) left = x - r.width - 14;
  if (top + r.height > innerHeight - pad) top = y - r.height - 14;
  tipEl.style.left = Math.max(pad, left) + "px";
  tipEl.style.top = Math.max(pad, top) + "px";
}
function hideTip() { if (tipEl) tipEl.hidden = true; }
function bindTip(row, lines) {
  row.addEventListener("pointermove", e => showTip(lines, e.clientX, e.clientY));
  row.addEventListener("pointerleave", hideTip);
  row.addEventListener("focus", () => {
    const r = row.getBoundingClientRect();
    showTip(lines, r.left + r.width * 0.55, r.top + r.height / 2);
  });
  row.addEventListener("blur", hideTip);
}

/* ---- Suivi de l'avancement ----
   L'état enregistré vit dans le bloc JSON #si-progress. Enregistrer publie une
   nouvelle version complète de la page, régénérée depuis ses sources. */
const PENDING_KEY = "si-roadmap-pending";
const FONTS_HREF = "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap";
const READ_ONLY_CODES = ["not_writer", "not_granted", "consent_required", "capability_disabled", "capability_removed", "not_declared", "read_only_path"];
const KNOWN_CODES = READ_ONLY_CODES.concat(["conflict", "too_large", "invalid_content", "rate_limited", "transform_error"]);

function readProgress() {
  try {
    const p = JSON.parse(document.getElementById("si-progress").textContent);
    return { done: p && p.done && typeof p.done === "object" ? p.done : {}, savedAt: (p && p.savedAt) || null };
  } catch (e) {
    return { done: {}, savedAt: null };
  }
}
const SAVED = readProgress();
let pending = {};
let tracker = "off"; // off → on | readonly | unavailable
let artifactNs = null;
let saving = false;
let flash = "";

const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const savedDone = id => SAVED.done[id] === true;
const isDone = id => (has(pending, id) ? pending[id] : savedDone(id));

function stashPending() {
  try {
    if (Object.keys(pending).length) sessionStorage.setItem(PENDING_KEY, JSON.stringify(pending));
    else sessionStorage.removeItem(PENDING_KEY);
  } catch (e) { /* stockage indisponible : l'état reste en mémoire */ }
}
function restorePending() {
  try {
    const raw = sessionStorage.getItem(PENDING_KEY);
    if (!raw) return;
    const known = new Set(ALL_TASKS.map(t => t.id));
    for (const [id, v] of Object.entries(JSON.parse(raw))) {
      if (known.has(id) && typeof v === "boolean" && v !== savedDone(id)) pending[id] = v;
    }
    stashPending();
  } catch (e) { pending = {}; }
}

function onToggle(id, checked) {
  if (tracker !== "on" || saving) return;
  if (checked === savedDone(id)) delete pending[id]; else pending[id] = checked;
  flash = "";
  stashPending();
  updateProgress();
}

function trackerNote() {
  const when = SAVED.savedAt
    ? "Enregistré le " + new Date(SAVED.savedAt).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }) + "."
    : "Aucun avancement enregistré.";
  if (tracker === "on") return when + " Cochez les tâches terminées, puis enregistrez.";
  if (tracker === "readonly") return when + " Vue en lecture seule : l'avancement ne peut pas être modifié ici.";
  if (tracker === "unavailable") return when + " Le suivi n'est pas disponible dans cette vue.";
  return when;
}

function updateProgress() {
  let doneCount = 0;
  const editable = tracker === "on" && !saving;
  for (const p of PHASES) {
    let c = 0;
    for (const t of p.tasks) {
      const d = isDone(t.id);
      if (d) c++;
      const input = document.getElementById("t-" + t.id);
      const li = document.querySelector('li[data-task="' + t.id + '"]');
      if (input) { input.checked = d; input.disabled = !editable; }
      if (li) {
        li.classList.toggle("is-done", d);
        li.querySelector(".pending-tag").hidden = !has(pending, t.id);
        li.querySelector(".task-row").classList.toggle("ro", tracker !== "on");
      }
    }
    doneCount += c;
    const cnt = document.getElementById("si-count-" + p.n);
    if (cnt) cnt.textContent = c + "/" + p.tasks.length;
  }
  const total = document.getElementById("si-total");
  total.textContent = String(doneCount);
  total.append(el("small", null, "sur " + ALL_TASKS.length + " tâches"));
  const meter = document.getElementById("si-meter");
  meter.firstChild.style.width = (doneCount / ALL_TASKS.length * 100) + "%";
  meter.setAttribute("aria-valuenow", String(doneCount));
  document.getElementById("si-note").textContent = trackerNote();
  renderSavebar();
}

let savebar = null, saveMsg = null, saveBtn = null, cancelBtn = null;
function renderSavebar() {
  if (!savebar) {
    savebar = el("div", "savebar");
    savebar.setAttribute("role", "region");
    savebar.setAttribute("aria-label", "Enregistrement de l'avancement");
    saveMsg = el("span");
    saveMsg.setAttribute("aria-live", "polite");
    cancelBtn = el("button", "btn ghost", "Annuler");
    cancelBtn.type = "button";
    cancelBtn.id = "si-cancel";
    saveBtn = el("button", "btn primary", "Enregistrer l'avancement");
    saveBtn.type = "button";
    saveBtn.id = "si-save";
    cancelBtn.addEventListener("click", () => { pending = {}; flash = ""; stashPending(); updateProgress(); });
    saveBtn.addEventListener("click", save);
    savebar.append(saveMsg, cancelBtn, saveBtn);
    document.body.append(savebar);
  }
  const n = Object.keys(pending).length;
  savebar.hidden = !(tracker === "on" && (n > 0 || flash));
  if (savebar.hidden) return;
  saveMsg.textContent = flash || (n > 1 ? n + " modifications non enregistrées" : "1 modification non enregistrée");
  saveBtn.hidden = cancelBtn.hidden = n === 0;
  saveBtn.disabled = cancelBtn.disabled = saving;
  saveBtn.textContent = saving ? "Enregistrement…" : "Enregistrer l'avancement";
}

function buildDocument(progress) {
  const endScript = "<" + "/script>";
  const json = JSON.stringify(progress).replace(/</g, "\\u003c");
  return "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n"
    + "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n"
    + "<title>Feuille de route SmartInvoice Desktop</title>\n"
    + "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n"
    + "<link rel=\"stylesheet\" href=\"" + FONTS_HREF + "\">\n"
    + "<style id=\"si-style\">" + document.getElementById("si-style").textContent + "</style>\n"
    + "</head>\n<body>\n<main id=\"app\"></main>\n"
    + "<script type=\"application/json\" id=\"si-progress\">" + json + endScript + "\n"
    + "<script id=\"si-app\">" + document.getElementById("si-app").textContent + endScript + "\n"
    + "</body>\n</html>\n";
}

async function publishWithRetry(html) {
  try {
    return await artifactNs.publish(html);
  } catch (err) {
    // Seule une erreur transitoire (code inconnu ou upstream_error) mérite un second essai.
    if (err && KNOWN_CODES.includes(err.code)) throw err;
    await new Promise(r => setTimeout(r, 600 + Math.random() * 900));
    return artifactNs.publish(html);
  }
}

async function save() {
  if (!artifactNs || saving || !Object.keys(pending).length) return;
  saving = true;
  flash = "";
  updateProgress();
  const done = {};
  for (const t of ALL_TASKS) if (isDone(t.id)) done[t.id] = true;
  const html = buildDocument({ done, savedAt: new Date().toISOString() });
  stashPending(); // survit au rechargement en cas de conflit
  try {
    await publishWithRetry(html);
    pending = {};
    stashPending();
    flash = "Avancement enregistré.";
  } catch (err) {
    const code = err && err.code;
    if (code === "conflict") flash = "Une version plus récente vient d'être publiée : la page se recharge, vos coches restent à enregistrer.";
    else if (READ_ONLY_CODES.includes(code)) tracker = "readonly";
    else if (code === "rate_limited") flash = "Trop d'enregistrements rapprochés : réessayez dans quelques secondes.";
    else if (code === "too_large" || code === "invalid_content" || code === "transform_error") flash = "Enregistrement refusé : la page générée n'est pas valide.";
    else flash = "Enregistrement impossible pour le moment. Réessayez.";
  } finally {
    saving = false;
    updateProgress();
  }
}

function initTracker() {
  const c = window.claude;
  const unavailable = () => { tracker = "unavailable"; updateProgress(); };
  if (!c || typeof c.use !== "function") return unavailable();
  c.use("artifact").then(ns => {
    if (!ns || typeof ns.publish !== "function") return unavailable();
    artifactNs = ns;
    tracker = "on";
    updateProgress();
  }, unavailable);
}

render();
restorePending();
updateProgress();
initTracker();
</script>
